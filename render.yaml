services:
  - type: web
    name: portaria-digital
    env: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: BTY_LLM_SERVER_BASE_URL
        value: https://aigw-api.happyseeds.ai/v1
      - key: BTY_LLM_SERVER_API_KEY
        sync: false
